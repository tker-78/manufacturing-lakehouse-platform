version: 2

models:
  - name: fact_sensor_reading
    description: "fact type: periodic snapshot fact,grain: timestamp x machine_id"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - timestamp
              - machine_id
    columns:
      - name: timestamp
        tests:
          - not_null
      - name: machine_id
        tests:
          - not_null
      - name: temperature
        tests:
          - not_null
      - name: humidity
        tests:
          - not_null
          - non_negative
      - name: pressure
        tests:
          - not_null
          - non_negative
      - name: energy_consumption
        tests:
          - not_null
          - non_negative


