version: 2

models:
  - name: dim_machine
    columns:
      - name: equipment_key
        tests:
          - not_null
          - unique
      - name: machine_id
        tests:
          - not_null
      - name: machine_name
        tests:
          - not_null
  - name: dim_machine_status
    columns:
      - name: machine_status_key
        tests:
          - not_null
          - unique
      - name: machine_status
        tests:
          - not_null
  - name: dim_failure_type
    columns:
      - name: failure_type_key
        tests:
          - not_null
          - unique
      - name: failure_type
        tests:
          - not_null




