version: 2

models:
  - name: stg_sensor
    columns:
      - name: timestamp
        tests:
          - not_null
      - name: machine_id
        tests:
          - not_null
      - name: temperature
        tests:
          - not_null
          - non_negative
      - name: vibration
        tests:
          - not_null
          - non_negative
      - name: humidity
        tests:
          - not_null
          - non_negative
      - name: pressure
        tests:
          - not_null
          - non_negative
      - name: energy_consumption
        tests:
          - not_null
          - non_negative
      - name: machine_status
        tests:
          - not_null
      - name: anomaly_flag
        tests:
          - not_null
      - name: predicted_remaining_life
        tests:
          - not_null
      - name: failure_type
        tests:
          - not_null
      - name: downtime_risk
        tests:
          - not_null
      - name: maintenance_required
        tests:
          - not_null
