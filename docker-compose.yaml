services:
  db:
    image: postgres:17
    working_dir: /app
    volumes:
      - db-data:/var/lib/postgresql/data
      - .:/app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakehouse
    ports:
      - "5432:5432"
  dbt:
    build: .
    environment:
      PYTHONPATH: /app
    depends_on:
      - db
    volumes:
      - ./:/app
volumes:
  db-data: